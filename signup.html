<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Encuentra trabajadores | OficiosYA</title>
  <meta name="description"
    content="Encuentra trabajadores calificados para tus proyectos en OficiosYA. Conecta con profesionales confiables y eficientes en tu área.">

  <link rel="canonical" href="https://oficiosya.com">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <meta property="og:type" content="website">

    content="Encuentra trabajadores calificados para tus proyectos en OficiosYA. Conecta con profesionales confiables y eficientes en tu área.">

  <meta property="og:url" content="https://oficiosya.com">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HomeAndConstructionBusiness",
      "name": "OficiosYA",
      "image": "https://oficiosya.com/imagenes/logo.jpg",
      "@id": "https://oficiosya.com",
      "url": "https://oficiosya.com",
      "telephone": "+543811234567",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "addressRegion": "Tucumán",
        "postalCode": "4000",
        "addressCountry": "AR"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Servicios de Reparación y Mantenimiento",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Plomería",
              "serviceType": "Plumber",
              "description": "Reparación de filtraciones, destapes de cañerías e instalación de griferías."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Instalaciones de Gas",
              "serviceType": "Gasfitter",
              "description": "Detección de fugas, habilitaciones e instalación de estufas y calefones por gasista matriculado."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Albañilería y Reformas",
              "serviceType": "Mason",
              "description": "Arreglos de mampostería, colocación de cerámicos y revoques."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Electricidad",
              "serviceType": "Electrician",
              "description": "Reparación de instalaciones eléctricas, iluminación y mantenimiento de tableros."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Carpintería y Ebanistería",
              "serviceType": "Carpenter",
              "description": "Fabricación y reparación de muebles, puertas y ventanas de madera."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Pintura y Decoración",
              "serviceType": "Painter",
              "description": "Pintura de interiores y exteriores, decoración y acabados."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Jardinería y Paisajismo",
              "serviceType": "Gardener",
              "description": "Mantenimiento de jardines, diseño de paisajes y cuidado de plantas."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Limpieza y Mantenimiento",
              "serviceType": "CleaningService",
              "description": "Servicios de limpieza profesional para hogares y oficinas."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Mudanzas y Transporte",
              "serviceType": "MovingCompany",
              "description": "Servicios de mudanza, transporte de muebles y logística."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Cerrajería",
              "serviceType": "Locksmith",
              "description": "Apertura de cerraduras, duplicado de llaves y reparación de sistemas de seguridad."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Aire Acondicionado y Climatización",
              "serviceType": "HVACService",
              "description": "Instalación, mantenimiento y reparación de sistemas de aire acondicionado y calefacción."

        ]

    }
</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="header-global"></div>

  <main class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="row w-100 justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">

        <form class="text-center w-100" novalidate>
          <h1 class="h3 mb-3 fw-normal">Crear cuenta</h1>

          <div class="form-floating mb-2 text-start w-100">
            <input type="text" class="form-control w-100" id="floatingName" placeholder="Juan Pérez">
            <label for="floatingName">Nombre completo</label>
            <div class="invalid-feedback" id="errorName"></div>
          </div>

          <div class="form-floating mb-2 text-start w-100">
            <input type="email" class="form-control w-100" id="floatingEmail" placeholder="name@example.com">
            <label for="floatingEmail">Email</label>
            <div class="invalid-feedback" id="errorEmail"></div>
          </div>

          <div class="form-floating mb-2 text-start w-100">
            <input type="password" class="form-control w-100" id="floatingNewPassword" placeholder="Contraseña">
            <label for="floatingNewPassword">Contraseña</label>
            <div class="invalid-feedback" id="errorPassword"></div>
          </div>

          <div class="form-floating mb-3 text-start w-100">
            <input type="password" class="form-control w-100" id="floatingConfirmPassword"
              placeholder="Repetir contraseña">
            <label for="floatingConfirmPassword">Confirmar contraseña</label>
            <div class="invalid-feedback" id="errorConfirmPassword"></div>
          </div>

          <div class="form-check d-flex justify-content-center gap-2 mb-1">
            <input class="form-check-input" type="checkbox" value="terms" id="checkTerms">
            <label class="form-check-label" for="checkTerms">
              Acepto los <a href="#" class="text-decoration-none">términos y condiciones</a>
            </label>
          </div>
          <div class="text-danger small mb-3" id="errorTerms"></div>

          <button class="btn btn-primary w-100 py-2 mb-3" type="submit">Registrarse</button>

          <div id="registro-estado" class="mb-3"></div>

          <p class="text-body-secondary">
            ¿Ya tienes cuenta? <a href="/login.html" class="text-decoration-none">Inicia sesión</a>
          </p>
        </form>

      </div>
    </div>
  </main>

  <div id="header-global"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="javascript/main.js"></script>
  <script src="javascript/script.js"></script>
</body>

</html>
