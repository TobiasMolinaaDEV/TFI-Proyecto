<body>
    <header>
        <section class="section-logo">
            <p class="logo"><strong>OficiosYA</strong></p>
            <a class="a1" href="">Registrate/Inicia sesion</a>
            <a class="a2" href="">Conviertete en Profesional</a>
        </section>
        <nav class="navbar" aria-label="Menú">
            <ul>
                <li><a href="/index.html">Inicio</a></li>
                <li><a href="/index.html#pepito">Servicios</a></li>
                <li><a href="/contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contacto">
            <div class="contenedor-formulario">
            <h1>Ponte en contacto con nosotros</h1>
            <p>Completa el formulario indicando tu solicitud y te responderemos a la brevedad.</p>

            <form action="http://127.0.0" method="POST">
                <div>
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                </div>

                <div>
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="Ej. juan@correo.com" required>
                </div>

                <div>
                    <label for="mensaje">Detalles de tu solicitud:</label>
                    <textarea class="textarea" id="mensaje" name="mensaje" placeholder="Escribe aquí su consulta." rows="10" required></textarea>
                </div>

                <button type="submit">Enviar mensaje</button>
            </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 OficiosYA. Todos los derechos reservados.</p>
        <address>
            <p>Contacto: <a href="mailto:contacto@oficiosya.com">contacto@oficiosya.com</a></p>
        </address>
    </footer>
