<html lang="es">

    <!-- Título SEO (ideal entre 50 y 60 caracteres con palabra clave) -->
    <title>Encuentra trabajadores | OficiosYA</title>

</head>
<body>

    </header> 
    <main>
        <!-- Subtítulo H2 para organizar el contenido -->

        <!-- Imagen con texto alternativo (ALT) optimizado para SEO -->

</body>
</html>
